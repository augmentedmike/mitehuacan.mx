# The periodic data agent: re-pulls OSM + DENUE for the whole service area
# (derived from the route network) every week and ships the diff.
# main is a protected branch (PRs only), so the agent commits to dev and
# opens/reuses a promote PR — data reaches the domain on Mike's one-click
# approval. To restore full autonomy: add github-actions to the protection
# rule's bypass list and this same workflow will merge its own PR.
name: refresh-pois
on:
  schedule:
    - cron: "17 9 * * 1"   # mondays 09:17 UTC (03:17 in Tehuacán)
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: refresh POI + places data from OSM
        run: python3 tehuacan/scripts/16_refresh_pois.py

      - name: refresh DENUE establishments (INEGI)
        run: |
          curl -s -o /tmp/denue.zip "https://www.inegi.org.mx/contenidos/masiva/denue/denue_21_csv.zip"
          unzip -o -q /tmp/denue.zip -d /tmp/denue
          cp /tmp/denue/conjunto_de_datos/denue_inegi_21_.csv tehuacan/poi/denue_puebla.csv
          python3 tehuacan/scripts/17_build_denue.py

      - name: rebuild site
        run: python3 tehuacan/scripts/09_build_site.py

      - name: commit to dev and open promote PR if data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "mitehuacan data agent"
          git config user.email "augmentedmike@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no data changes this week"
            exit 0
          fi
          git commit -m "pois: weekly osm + denue refresh (automated agent)"
          git push origin dev
          # main is protected: surface the change as a promote PR (reuse if open)
          if ! gh pr list --base main --head dev --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr create --base main --head dev \
              --title "promote: weekly data refresh (automated agent)" \
              --body "Weekly OSM + DENUE refresh from the data agent. Approve to ship the fresh data to the domain."
          else
            echo "open dev->main PR already exists; refresh is included in it"
          fi
