# Backoffice / ops app — SEPARATE Pages project. Owns ALL writes.
# production (--branch main) → PROD database. preview (any other branch) →
# the staging database, for testing admin changes safely.
name = "mitehuacan-admin"
compatibility_date = "2026-07-01"
pages_build_output_dir = "public"

[env.production]
[[env.production.d1_databases]]
binding = "DB"
database_name = "quecombi"
database_id = "b0a959fa-8e8c-4c10-b1bd-a02f2408a4cd"

[env.preview]
[[env.preview.d1_databases]]
binding = "DB"
database_name = "quecombi-staging"
database_id = "89f04f58-9351-4b70-8dfb-845a4cf1d8d9"
