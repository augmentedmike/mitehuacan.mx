# Backoffice / ops app — SEPARATE Pages project. Owns ALL writes.
# production (--branch main) → PROD database. preview (any other branch) →
# the staging database, for testing admin changes safely.
name = "mitehuacan-admin"
compatibility_date = "2026-07-01"
pages_build_output_dir = "public"

[env.production]
[[env.production.d1_databases]]
binding = "DB"
database_name = "mitehuacan"
database_id = "57ff6a8d-ae71-4f40-b494-c7f16dd083e4"

[env.preview]
[[env.preview.d1_databases]]
binding = "DB"
database_name = "mitehuacan-staging"
database_id = "bd3c4e16-b81e-4e65-88fc-d49cbf6b7e06"
