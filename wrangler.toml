# Cloudflare Pages config (public site + read-only functions). See SECURITY.md.
# ENV SEPARATION: production (branch main → mitehuacan.mx data) and preview
# (staging + any other branch) bind DIFFERENT D1 databases — staging can never
# touch production data.
name = "mitehuacan"
compatibility_date = "2026-07-01"
pages_build_output_dir = "site"

# top-level binding = what LOCAL `wrangler pages dev` uses (local sqlite only);
# deploys always use the env-scoped bindings below
[[d1_databases]]
binding = "DB"
database_name = "mitehuacan"
database_id = "57ff6a8d-ae71-4f40-b494-c7f16dd083e4"
migrations_dir = "src/migrations"

# FOTOS_KV = user-uploaded photo storage (POST /api/foto -> bytes; served by
# /api/foto/<key>). KV is the no-card bridge (free plan: 1 GB, 1k writes/day,
# 100k reads/day, $0 egress). Same prod/preview split as D1. UPGRADE PATH: when
# R2 is enabled (needs a card), swap this for an [[r2_buckets]] FOTOS binding and
# switch the .put/.get calls in functions/api/foto* — R2's free tier is 10 GB.
[[kv_namespaces]]
binding = "FOTOS_KV"
id = "177b627ecd034602a05129695a2c37b1"          # prod namespace
preview_id = "034e264d2a9a478eb4c96ceb1028eb33"  # local pages dev uses this

[env.production]
[[env.production.d1_databases]]
binding = "DB"
database_name = "mitehuacan"
database_id = "57ff6a8d-ae71-4f40-b494-c7f16dd083e4"
migrations_dir = "src/migrations"
[[env.production.kv_namespaces]]
binding = "FOTOS_KV"
id = "177b627ecd034602a05129695a2c37b1"

[env.preview]
[[env.preview.d1_databases]]
binding = "DB"
database_name = "mitehuacan-staging"
database_id = "bd3c4e16-b81e-4e65-88fc-d49cbf6b7e06"
migrations_dir = "src/migrations"
[[env.preview.kv_namespaces]]
binding = "FOTOS_KV"
id = "034e264d2a9a478eb4c96ceb1028eb33"
